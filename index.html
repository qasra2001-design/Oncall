<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emergency On-Call Roster (Today)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 12px; }
    h2 { margin: 0 0 12px 0; }
    .bar {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .date-input { display: flex; gap: 8px; align-items: center; }
    input[type="date"] { padding: 6px; }
    button { padding: 7px 12px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; vertical-align: top; }
    th { background: #f4f4f4; text-align: left; }
    .speciality { width: 22%; font-weight: 700; }
    .slot-block { min-width: 240px; }
    .slot-title { font-size: 12px; color: #555; margin-bottom: 4px; font-weight: 700; }
    .person { font-weight: 600; }
    .phone { color: #0b57d0; word-break: break-word; }
    .muted { color: #777; font-size: 12px; }
    .edit input { width: 100%; padding: 6px; box-sizing: border-box; margin-bottom: 8px; }
    .grid { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
    .actions { margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Emergency Department — On-Call Doctors</h2>

  <div class="bar">
    <div class="date-input">
      <span><b>Date:</b></span>
      <input id="datePicker" type="date" />
    </div>

    <div>
      <label style="margin-right:8px;"><b>Mode:</b></label>
      <select id="modeSelect">
        <option value="view" selected>View (Emergency Screen)</option>
        <option value="edit">Edit (Roster)</option>
      </select>
    </div>

    <div>
      <label style="margin-right:8px;"><b>Speciality:</b></label>
      <select id="specialitySelect"></select>
    </div>

    <div class="actions">
      <button id="saveBtn" style="display:none;">Save Changes</button>
      <span id="status" class="muted"></span>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th class="speciality">Speciality</th>
        <th>First</th>
        <th>Second</th>
      </tr>
      <tr>
        <th></th>
        <th>Name & Phone No.</th>
        <th>Name & Phone No.</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script type="module" src="./app.js"></script>
</body>
</html>
